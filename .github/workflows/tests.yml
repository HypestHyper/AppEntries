name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q desktop-file-utils appstream libglib2.0-bin
          python3 -m pip install --quiet pytest ruff==0.16.8
      - name: Ruff
        run: python3 -m ruff check app_entries tests tools
      - name: Unit tests
        run: python3 -m pytest -q tests
      - name: Validate data files
        run: tests/validate-desktop.sh
