name: Release

# Attaches a ready-to-install archive and the notes from that version's section in
# CHANGELOG.md to a GitHub release. Runs when a tag like v1.0.0 is pushed or a release
# is published from the Releases page, or by hand (Actions tab, Release, Run workflow):
# it then uses the version in app_entries/__init__.py. An existing release gets its notes
# rewritten and the archive replaced. With "Move the tag" ticked, a run by hand also moves
# the existing release's tag to this commit, for fixes that don't need a new version
# (wording, documentation).
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      move_tag:
        description: "Move the existing release's tag to this commit (for fixes that don't need a new version)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app_entries/__init__.py)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match app_entries/__init__.py's version $v"; exit 1
          fi
          grep -q "^## $v " CHANGELOG.md || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Run the tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q tests
      - name: Build the archive
        run: |
          git archive --format=tar.gz --prefix="app-entries-$VERSION/" -o "app-entries-$VERSION.tar.gz" HEAD \
            -- . ':!tests' ':!.github' ':!tools'
      - name: Write the release notes
        run: |
          awk -v head="## $VERSION " 'index($0, head) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ## Install or update

          **With git** (easiest to keep up to date). To install:

              git clone https://github.com/${GITHUB_REPOSITORY}.git
              cd ${GITHUB_REPOSITORY#*/}
              ./install.sh

          To update a copy you cloned before, run these in its folder:

              git pull
              ./install.sh

          **Or download** app-entries-$VERSION.tar.gz from the files below, then:

              tar xzf app-entries-$VERSION.tar.gz
              cd app-entries-$VERSION
              ./install.sh

          Either way, your settings and hidden apps are kept.
          NOTES
      - name: Move the tag
        if: github.event_name == 'workflow_dispatch' && inputs.move_tag
        run: |
          git tag -f "v$VERSION" "$GITHUB_SHA"
          git push -f origin "v$VERSION"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "app-entries-$VERSION.tar.gz" --clobber
            gh release edit "v$VERSION" --title "App Entries $VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" "app-entries-$VERSION.tar.gz" --title "App Entries $VERSION" \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi
