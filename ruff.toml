# Ruff (https://github.com/astral-sh/ruff), run in CI with the version pinned
# there: Ruff's own default rules, plus checks aimed at bugs. App Entries
# supports Python 3.9, so newer syntax (like X | None) isn't suggested.
target-version = "py39"
line-length = 120

[lint]
extend-select = [
    "F",       # pyflakes: undefined and unused names
    "E", "W",  # pycodestyle errors and warnings
    "B",       # bugbear: likely bugs
    "BLE",     # catch-all except, which must be marked as meant
    "PLE",     # pylint errors
    "PLW",     # pylint warnings
    "RUF021",  # brackets where and/or mix
]
ignore = [
    "E741",     # names like l: fine here
    "B904",     # raise ... from inside except: the messages say what happened
    "PLW1510",  # subprocess.run without check: return codes are read
    "PLW0603",  # module-level caches
    "PLW2901",  # cleaning up a loop value in place
    "FA100",    # X | None needs `from __future__ import annotations` on 3.9; Optional is kept
]

[lint.per-file-ignores]
"app_entries/ui/style.py" = ["E501"]   # CSS rules, one per line
